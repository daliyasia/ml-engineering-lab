name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: Python tests (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      CUDA_VISIBLE_DEVICES: ""
      # Keep the cache beside .venv so large locked CUDA wheels can be hardlinked.
      UV_LINK_MODE: hardlink
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-local-path: ${{ github.workspace }}/.cache/uv
          # Retain downloaded wheels to avoid repeated multi-GB CUDA downloads.
          prune-cache: false

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Check lockfile
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check installed dependencies
        run: uv pip check

      - name: Run tests without sweeps
        run: >-
          uv run --locked pytest --ignore=tests/test_sweeps.py -ra
          --junitxml="$RUNNER_TEMP/pytest-cpu.xml"

      - name: Upload CPU test report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pytest-cpu
          path: ${{ runner.temp }}/pytest-cpu.xml
          retention-days: 7
          if-no-files-found: ignore
