name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: Python tests (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      CUDA_VISIBLE_DEVICES: ""
      # Keep the cache beside .venv so large locked CUDA wheels can be hardlinked.
      UV_LINK_MODE: hardlink
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-local-path: ${{ github.workspace }}/.cache/uv
          # Retain downloaded wheels to avoid repeated multi-GB CUDA downloads.
          prune-cache: false

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Check lockfile
        run: uv lock --check

      - name: Install locked dependencies
        id: dependencies
        run: uv sync --locked

      - name: Check installed dependencies
        run: uv pip check

      - name: Run tests without sweeps
        run: >-
          uv run --locked pytest --ignore=tests/test_sweeps.py -ra
          --junitxml="$RUNNER_TEMP/pytest-cpu.xml"

      - name: Ruff lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run --locked ruff check .

      - name: Ruff formatting
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run --locked ruff format --check .

      - name: MyPy core training path
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        # Explicit paths keep the initial scope visible; pyproject.toml mirrors this list.
        run: >-
          uv run --locked mypy src/train.py src/eval.py src/data
          src/models/mnist_module.py src/models/components src/utils

      - name: Publish coverage summary
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = Path("coverage.json")
          lines = ["## CPU test coverage", ""]
          if report.is_file():
              totals = json.loads(report.read_text())["totals"]
              lines += ["| Metric | Covered / total | Coverage |", "| --- | ---: | ---: |"]
              for label, covered, total in [
                  ("Statements", totals["covered_lines"], totals["num_statements"]),
                  ("Branches", totals["covered_branches"], totals["num_branches"]),
                  ("Combined", totals["covered_lines"] + totals["covered_branches"],
                   totals["num_statements"] + totals["num_branches"]),
              ]:
                  percentage = f"{100 * covered / total:.2f}%" if total else "N/A"
                  lines.append(f"| {label} | {covered} / {total} | {percentage} |")
          else:
              lines.append("Coverage unavailable: the test run did not generate coverage.json.")
          summary = "\n".join(lines) + "\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary)
          PY

      - name: Upload CPU test report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pytest-cpu
          path: ${{ runner.temp }}/pytest-cpu.xml
          retention-days: 7
          if-no-files-found: ignore
