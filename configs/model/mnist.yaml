_target_: src.models.mnist_module.MNISTLitModule

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.001
  weight_decay: 0.0

scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
  mode: min
  factor: 0.1
  patience: 10

net:
  _target_: src.models.components.mnist.ResNet
  layers: [1, 1, 1, 1]
  bottleneck_dims: [64, 64, 64, 64]
  strides: [2, 2, 1, 1]
  dropout: 0.0
  normalize: False
  n_classes: 10
