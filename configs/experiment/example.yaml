# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: vignface.yaml
  - override /model: vignface.yaml
  - override /callbacks: default.yaml
  - override /trainer: ddp.yaml


# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["vignface", "clirisnetv2"]

seed: 12345

trainer:
  min_epochs: 10
  max_epochs: 10


model:
  optimizer:
    lr: 0.002
  netmnet:
    out_channel: 64

data:
  batch_size: 64

logger:
  wandb:
    tags: ${tags}
    project: "vignface"
  aim:
    experiment: "vignface"
