# @package _global_

# uv run python src/train.py experiment=example
defaults:
  - override /data: mnist.yaml
  - override /model: mnist.yaml
  - override /callbacks: default.yaml
  - override /trainer: gpu.yaml
  - override /logger: csv.yaml

tags: [mnist, resnet]
seed: 12345

trainer:
  min_epochs: 10
  max_epochs: 10

model:
  optimizer:
    lr: 0.002

data:
  batch_size: 64
